<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&family=Spline+Sans%3Awght%40400%3B500%3B700" onload="this.rel='stylesheet'" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>Stitch Design</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
      :root {
        --primary-color: #f07167;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
</head>
<body class="bg-[#111714]">
    <div
      class="relative flex size-full min-h-screen flex-col dark group/design-root overflow-x-hidden"
      style="font-family: 'Spline Sans', 'Noto Sans', sans-serif"
    >
      <div class="flex flex-col">
        <header class="flex items-center justify-between p-4 pb-2">
          <button class="text-white">
            <span class="material-symbols-outlined text-3xl">menu</span>
          </button>
          <h1 class="text-white text-xl font-bold">Menu</h1>
          <button class="text-white">
            <span class="material-symbols-outlined text-3xl">search</span>
          </button>
        </header>
        <main class="p-4 pt-6 space-y-4">
          {% load static %}
          <a
            class="block w-full overflow-hidden rounded-2xl relative shadow-lg"
            href="#"
          >
            <img
              alt="plat"
              class="w-full h-36 object-cover"
              src="https://i.imgur.com/rRsgBVU.jpeg"
            />
            <div
              class="absolute inset-0 bg-black/40 p-4 flex flex-col justify-end"
            >
              <h2 class="text-white text-2xl font-bold">Plats</h2>
              <p class="text-gray-200 text-sm">plat ,pizza , tacos , burger.</p>
            </div>
          </a>
          <a
            class="block w-full overflow-hidden rounded-2xl relative shadow-lg"
            href="{% url 'details_page' category_name='Plats' %}"
          >
            <img
              alt="Main Courses"
              class="w-full h-36 object-cover"
              src="https://i.imgur.com/sdeChC9.jpeg"
            />
            <div
              class="absolute inset-0 bg-black/40 p-4 flex flex-col justify-end"
            >
              <h2 class="text-white text-2xl font-bold">accompagnement</h2>
              <p class="text-gray-200 text-sm">frittes , salades</p>
            </div>
          </a>
          <a
            class="block w-full overflow-hidden rounded-2xl relative shadow-lg"
            href="#"
          >
            <img
              alt="Desserts"
              class="w-full h-36 object-cover"
              src="https://i.imgur.com/PdQvu3P.png"
            />
            <div
              class="absolute inset-0 bg-black/40 p-4 flex flex-col justify-end"
            >
              <h2 class="text-white text-2xl font-bold">Dessert</h2>
              <p class="text-gray-200 text-sm">boison, crépes</p>
            </div>
          </a>
        </main>
      </div>
      <footer class="sticky bottom-0">
        <div
          class="flex justify-around bg-[#1c2620]/80 backdrop-blur-sm border-t border-[#29382f] py-2"
        >
          <a
            class="flex flex-col items-center justify-end gap-1 text-[var(--primary-color)]"
            href="#"
          >
            <span class="material-symbols-outlined">restaurant_menu</span>
            <p class="text-xs font-medium tracking-[0.015em]">Menu</p>
          </a>
          <a
            class="flex flex-col items-center justify-end gap-1 text-gray-400"
            href="#"
          >
            <span class="material-symbols-outlined">shopping_cart</span>
            <p class="text-xs font-medium tracking-[0.015em]">Cart</p>
          </a>
          <a
            class="flex flex-col items-center justify-end gap-1 text-gray-400"
            href="#"
          >
            <span class="material-symbols-outlined">receipt_long</span>
            <p class="text-xs font-medium tracking-[0.015em]">Orders</p>
          </a>
          <a
            class="flex flex-col items-center justify-end gap-1 text-gray-400"
            href="#"
          >
            <span class="material-symbols-outlined">person</span>
            <p class="text-xs font-medium tracking-[0.015em]">Profile</p>
          </a>
        </div>
      </footer>
    </div>
</body>
</html>
